[project]
name = "prism-radar"
version = "0.1.0"
description = "💎 Real-time topological blast radius and contract analysis for AI-generated code. Know what will break before you commit."
readme = "README.md"
authors = [
    { name = "shenald-dev", email = "bot@shenald.dev" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "vibe-coding", "blast-radius", "code-analysis", "ast", "cli", "dependency-graph", "contracts", "git-diff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities"
]
dependencies = [
    "rich>=13.7.0",
    "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0"
]

[project.scripts]
prism = "prism.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
